x-build: &build
  context: .
  args:
    - VERSION=${VERSION:-dev}

x-service: &service
  user: "1000:1000"
  # :z: SELinux hosts deny bind mounts without it.
  volumes:
    - ./config/config.yaml:/config/config.yaml:ro,z
    - ./music:/music:z
    - ./logs:/logs:z
    - ytmusic-cache:/tmp/.cache

services:
  ytmusic-cli:
    <<: *service
    build:
      <<: *build
      target: cli
    image: ytmusic:cli
    container_name: ytmusic-cli
    profiles:
      - cli

  ytmusic-web:
    <<: *service
    build:
      <<: *build
      target: web
    image: ytmusic:web
    container_name: ytmusic-web
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  ytmusic-cache:
