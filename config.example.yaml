# Looked up in ./ytmusic.yaml, ~/.config/ytmusic/config.yaml, ~/.ytmusic.yaml, or --config.

# 1-10. Too many and YouTube rate-limits.
parallel_jobs: 4

# 1-10. MusicBrainz and iTunes stay throttled however high this is.
metadata_workers: 4

# chrome, firefox, brave, …; for age-restricted or private videos. Leave empty in Docker.
cookies_browser: ""

# mp3, m4a, opus, flac, wav, aac
audio_format: mp3

verbose: false

# skip_lyrics: false

# Tried in list order. Supported: spotify, musicbrainz, deezer, itunes.
metadata_providers:
  - spotify
  - deezer
  - musicbrainz
  - itunes

# Needed only with spotify: https://developer.spotify.com/dashboard
spotify_client_id: ""
spotify_client_secret: ""

# Strongly recommended, needs fpcalc: https://acoustid.org/login
acoustid_api_key: ""

# 0.0-1.0. Below it, the yt-dlp tags stay.
# confidence_threshold: 0.7

# Docker: /music
output_dir: "~/Music"

# Docker: /logs
# log_dir: "~/.local/share/ytmusic/logs"

# --- ytmusic-web only ---

# password_hash from: ytmusic-web -hash-password
auth:
  enabled: true
  username: ""
  password_hash: ""
  session_ttl: "720h"

# Only with a reverse proxy in front: trusts X-Forwarded-Proto and X-Forwarded-For.
behind_proxy: false

# Jobs beyond this wait in the queue. Each runs parallel_jobs downloads.
max_concurrent_jobs: 1

# Empty means any site yt-dlp supports.
# allowed_hosts:
#   - youtube.com
#   - music.youtube.com
