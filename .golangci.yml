version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # Closing a response body that was only read, and printing to the
        # terminal: no caller could act on the error. Anything else, closing a
        # written file included, has to handle it or say why not.
        - (io.Closer).Close
        - fmt.Fprint

formatters:
  enable:
    - gofmt
