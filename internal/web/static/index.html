<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytmusic - YouTube Playlist Downloader</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>ytmusic</h1>
            <button id="logout-btn" class="logout-btn" onclick="logout()">Sign out</button>
        </div>

        <div class="download-form">
            <input type="text" id="url-input" placeholder="https://www.youtube.com/playlist?list=..." />
            <button id="download-btn" onclick="startDownload()">Download</button>
        </div>

        <div id="error-message" class="error hidden"></div>

        <div id="jobs">
            <h2>Jobs</h2>
            <p id="jobs-empty" class="empty hidden">No jobs yet</p>
            <div id="jobs-list" class="jobs-list"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
